# Dev/test-only orchestration. Runs the same quality gate as CI.
# Not part of the shipped product (see Dockerfile.test header note).

services:
  verify:
    build:
      context: ..
      dockerfile: dev/Dockerfile.test
    command: npm run verify
    volumes:
      - ./:/app
      - node_modules:/app/node_modules

  e2e:
    build:
      context: ..
      dockerfile: dev/Dockerfile.test
    command: npm run build && npx playwright install --with-deps chromium && npm run test:e2e
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    environment:
      - CHROME_CHANNEL=chromium
      - TEST_TIMEOUT_MS=30000

volumes:
  node_modules:
